<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Random Password: <span id="show"></span></p>
    <button onclick="generate()">Generate Password</button>
    <script>
        function generate(){
            var 
            passwordList="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@*&$"
            password=[]
            for(i=1;i<=6;i++){
                var randomnumber=Math.floor(Math.random()*passwordList.length)
                var randomcharacter=passwordList.charAt(randomnumber)
                password.push(randomcharacter)
            }
            password=password.join("")
            console.log(password)
            document.getElementById("show").innerHTML=password
        }
    </script>
</body>
</html>
